name: Build MY PSP APK from ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Found $ZIP"
          unzip -q "$ZIP" -d extracted
          ls extracted
          PROJECT=$(find extracted -name "app" -type d | head -n 1 | xargs dirname)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV
          echo "Project is $PROJECT"
      - name: Build APK
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MY-PSP-APK
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
